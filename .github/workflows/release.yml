name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only (no publish or GitHub Release)'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tiagomoscoso'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Pack dry-run
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: CLI smoke
        run: node bin/forgespec.js --help

      - name: Resolve release version
        id: version
        run: |
          PKG="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            EXPECTED="v${PKG}"
            if [ "$TAG" != "$EXPECTED" ]; then
              echo "Tag $TAG does not match package.json version $EXPECTED"
              exit 1
            fi
          else
            TAG="v${PKG}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "Release target: $TAG (package.json $PKG)"

      - name: Pack release artifacts
        run: |
          rm -f ./*.tgz SHA256SUMS
          pnpm pack
          ls -1 ./*.tgz
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Duplicate version guard
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@tiagomoscoso/forgespec@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Package version ${VERSION} already exists on GitHub Packages."
            exit 1
          fi
          echo "Package version ${VERSION} is not yet published."

      - name: Existing GitHub Release guard
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
            exit 1
          fi
          echo "GitHub Release $TAG does not exist yet."

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks

      - name: GitHub Release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" ./*.tgz SHA256SUMS --generate-notes --title "$TAG"
