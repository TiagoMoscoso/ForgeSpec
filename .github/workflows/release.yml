name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tiagomoscoso'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Pack
        run: |
          pnpm pack
          ls -1 *.tgz
          sha256sum *.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Duplicate version guard
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@tiagomoscoso/forgespec@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Package version ${VERSION} already exists on GitHub Packages."
            exit 1
          fi

      - name: Publish to GitHub Packages
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access restricted

      - name: GitHub Release
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" *.tgz SHA256SUMS --generate-notes --title "$TAG"
