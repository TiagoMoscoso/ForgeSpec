name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish @tiagomoscoso/forgespec to GitHub Packages
          and create a GitHub Release.
          Uncheck only for a validation-only run.
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  PACKAGE_NAME: '@tiagomoscoso/forgespec'
  REGISTRY_URL: 'https://npm.pkg.github.com'
  SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  release:
    name: Publish package and release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js and GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tiagomoscoso'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Pack dry-run
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: CLI smoke
        run: node bin/forgespec.js --help

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          PKG="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            EXPECTED="v${PKG}"

            if [ "$TAG" != "$EXPECTED" ]; then
              echo "::error::Tag $TAG does not match package.json version $EXPECTED"
              exit 1
            fi
          else
            TAG="v${PKG}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Release summary
        shell: bash
        run: |
          if [ "${{ env.SHOULD_PUBLISH }}" = "true" ]; then
            MODE="PUBLISH"
          else
            MODE="DRY RUN"
          fi

          {
            echo "## ForgeSpec Release"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Mode | **${MODE}** |"
            echo "| Package | \`${{ env.PACKAGE_NAME }}\` |"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Tag | \`${{ steps.version.outputs.tag }}\` |"
            echo "| Registry | \`${{ env.REGISTRY_URL }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack release artifact
        run: |
          rm -f ./*.tgz SHA256SUMS
          pnpm pack
          sha256sum ./*.tgz > SHA256SUMS

      - name: '[PUBLISH] Guard package version'
        if: env.SHOULD_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if npm view \
            "${{ env.PACKAGE_NAME }}@${VERSION}" \
            version \
            --registry="${{ env.REGISTRY_URL }}" \
            >/dev/null 2>&1
          then
            echo "::error::${{ env.PACKAGE_NAME }}@${VERSION} already exists."
            echo "::error::Bump package.json before publishing another release."
            exit 1
          fi

      - name: '[PUBLISH] Guard GitHub Release'
        if: env.SHOULD_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG already exists."
            exit 1
          fi

      - name: '[PUBLISH] Publish to GitHub Packages'
        id: publish
        if: env.SHOULD_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks

      - name: '[PUBLISH] Create GitHub Release'
        id: github_release
        if: env.SHOULD_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          gh release create "$TAG" \
            ./*.tgz \
            SHA256SUMS \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$TAG"

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "### Result"

            if [ "${{ env.SHOULD_PUBLISH }}" != "true" ]; then
              echo "Validation-only run. Nothing was published."

            elif [ "${{ steps.publish.outcome }}" = "success" ] && \
                 [ "${{ steps.github_release.outcome }}" = "success" ]; then

              echo "Published \`${{ env.PACKAGE_NAME }}@${{ steps.version.outputs.version }}\`."
              echo ""
              echo "Created GitHub Release \`${{ steps.version.outputs.tag }}\`."

            else
              echo "Publish mode was enabled, but release did not complete."
              echo "Inspect the failed step above."
            fi

          } >> "$GITHUB_STEP_SUMMARY"
